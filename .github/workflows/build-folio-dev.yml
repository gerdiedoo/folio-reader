name: Build Folio Dev APK

on:
  push:
    branches: [development]
    paths:
      - .github/workflows/build-folio-dev.yml
      - eas.json
      - app.json
      - app.config.js
      - App.tsx
      - index.ts
      - src/**
      - scripts/report-eas-build-error.cjs
      - supabase/**
      - assets/**
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-dev-apk
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_PUBLIC_APP_VARIANT: development
      EAS_BUILD_PROFILE: dev-preview
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Test PostgreSQL account isolation
        run: |
          set +e
          npm run test:account-db 2>&1 | tee "$RUNNER_TEMP/folio-account-db.log"
          account_test_status=${PIPESTATUS[0]}
          set -e
          if [ "$account_test_status" -ne 0 ]; then
            node <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          // This test only uses a disposable database and synthetic records.
          const log = fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'folio-account-db.log'), 'utf8').slice(-12000);
          const escaped = log.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          console.log(`::error title=PostgreSQL isolation test failed::${escaped}`);
          JS
          fi
          exit "$account_test_status"
      - name: Check TypeScript
        run: npm run typecheck
      - name: Check Expo token is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo '::error::Add the EXPO_TOKEN repository secret before rerunning this workflow.'
            exit 1
          fi
      - name: Load the test profile for local EAS config evaluation
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const env = require('./eas.json').build['dev-preview'].env;
          for (const name of ['EXPO_PUBLIC_APP_VARIANT', 'EXPO_PUBLIC_DEV_SUPABASE_URL', 'EXPO_PUBLIC_DEV_SUPABASE_KEY']) {
            const value = env[name];
            if (!value || /[\r\n]/.test(value)) throw new Error(`Missing or invalid ${name}`);
            fs.appendFileSync(process.env.GITHUB_ENV, `${name}=${value}\n`);
          }
          JS
      - name: Set up authenticated EAS CLI
        uses: expo/expo-github-action@5273c2136bd09c2a341fe3340d3e767ce5a13015 # v9.0.2
        with:
          eas-version: 24.13.0
          # Install the pinned CLI directly; avoid the unreliable optional cache.
          eas-cache: false
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Set up Java for the Android build
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check the runner Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo '::error::The GitHub runner Android SDK is unavailable.'
            exit 1
          fi
          java -version
      - name: Build standalone Android APK on this runner
        env:
          GRADLE_OPTS: -Dorg.gradle.workers.max=2
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          set +e
          # Local EAS uses the existing Expo signing credentials without a cloud build slot.
          eas build --platform android --profile dev-preview --non-interactive --local --output "$RUNNER_TEMP/folio-dev.apk" 2>&1 | tee "$RUNNER_TEMP/folio-dev-build.log"
          eas_build_status=${PIPESTATUS[0]}
          set -e
          if [ "$eas_build_status" -ne 0 ]; then
            node scripts/report-eas-build-error.cjs "$RUNNER_TEMP/folio-dev-build.log"
            exit "$eas_build_status"
          fi
          if [ ! -s "$RUNNER_TEMP/folio-dev.apk" ]; then
            echo '::error::The local build completed without producing folio-dev.apk.'
            exit 1
          fi
      - name: Upload Folio Dev APK
        id: apk
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: folio-dev-apk
          path: ${{ runner.temp }}/folio-dev.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Show APK download
        env:
          APK_ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const url = new URL(process.env.APK_ARTIFACT_URL);
          if (url.protocol !== 'https:' || url.hostname !== 'github.com') {
            throw new Error('Expected a GitHub Actions artifact download.');
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '# Folio Dev is ready to install',
            '',
            `[Download folio-dev-apk (ZIP)](${url.href})`,
            '',
            'On your Android phone, download the ZIP and extract **folio-dev.apk** in Files.',
            'Tap the APK and install it over your existing **Folio Dev** app.',
            'Keep the main Folio app installed; do not clear Folio Dev data.',
            '',
            'The APK was built on the GitHub runner using the existing Expo signing credentials.',
            'This does not use an Expo cloud Android build slot. The artifact is kept for 7 days.',
            '',
            `Source commit: ${process.env.GITHUB_SHA}`,
            '',
            'Use the phone checklist in docs/android-testing.md.',
            '',
          ].join('\n'));
          JS
      - name: Explain build failure
        if: failure()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF_SUMMARY'
          ## Folio Dev build did not complete

          Open the **EAS APK build failed** annotation or the failed step for the
          actual error from the local Android build. Check that the saved Expo token
          belongs to an account/robot with Developer access to this app's EAS project.
          Android signing setup, project permissions or the runner toolchain may block a build.
          This workflow builds locally on GitHub and does not use the Expo cloud build quota.
          Fix the reported issue, then use **Re-run failed jobs**. Do not post tokens in logs or chat.
          EOF_SUMMARY
